<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Promovideo · Review</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#171a16;color:#f6f7f3;font:15px system-ui}header{height:72px;padding:22px 28px;border-bottom:1px solid #343a31;display:flex;justify-content:space-between}header span{color:#b4bdb0}main{display:grid;grid-template-columns:minmax(0,1fr) 340px;height:calc(100vh - 72px)}.preview{display:flex;flex-direction:column;padding:28px;min-height:0}.stage{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center}video,#frame{max-height:100%;max-width:100%;object-fit:contain}#frame{position:absolute;inset:0;margin:auto;width:100%;height:100%;pointer-events:none}.timeline{padding-top:22px}input[type=range]{width:100%;accent-color:#9fe870}.transport{display:flex;align-items:center;gap:12px;margin-top:12px}button,select{font:inherit;color:inherit;border:1px solid #50584a;background:#2c3228;border-radius:10px;padding:10px 14px;cursor:pointer}button:hover{background:#3c4536}button.primary{background:#9fe870;color:#163300;border:0}.time{font-variant-numeric:tabular-nums;color:#b4bdb0}.panel{border-left:1px solid #343a31;padding:24px;overflow:auto}h2{font-size:16px;margin:0 0 15px}section{margin-bottom:30px}input[type=color]{width:48px;height:42px;border:0;padding:0;background:transparent}#swatches{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.swatch{width:24px;height:24px;border-radius:50%;padding:0}textarea{width:100%;min-height:110px;border:1px solid #50584a;border-radius:10px;background:#22271f;color:white;padding:12px;font:inherit;resize:vertical}.hint,#status{font-size:13px;line-height:1.5;color:#b4bdb0}.comment{padding:12px 0;border-bottom:1px solid #343a31;white-space:pre-wrap;overflow-wrap:anywhere}.comment button{padding:3px 8px;font-size:12px;margin-right:8px}.actions{display:flex;flex-wrap:wrap;gap:8px}.colour-row{display:flex;gap:12px;align-items:center}#markers{position:relative;height:9px}.marker{position:absolute;width:6px;height:9px;border:0;padding:0;background:#9fe870;border-radius:3px}a{color:#9fe870}@media(max-width:800px){main{display:flex;flex-direction:column;height:auto}.preview{height:70vh}.panel{border-top:1px solid #343a31;border-left:0}}
</style>
<header><strong>Promovideo <span> / Review</span></strong><span>Local project</span></header>
<main><div class="preview"><div class="stage"><video id="video" src="/video" playsinline preload="auto"></video><img id="frame" alt="Live background preview" hidden></div><div class="timeline"><div id="markers"></div><input id="scrub" aria-label="Video timeline" type="range" min="0" max="1" step="0.0166667" value="0"><div class="transport"><button id="play">Play</button><button id="back" aria-label="Previous frame">−1 frame</button><button id="next" aria-label="Next frame">+1 frame</button><span class="time" id="clock"></span><select id="rate" aria-label="Playback speed"><option value="0.5">0.5×</option><option value="0.75">0.75×</option><option value="1" selected>1×</option><option value="1.25">1.25×</option></select></div></div></div>
<aside class="panel"><section><h2>Background</h2><div class="colour-row"><input type="color" id="colour" aria-label="Background colour"><span id="hex"></span></div><div id="swatches"></div><p class="hint">Preview colours from the editable layers. Export to apply the colour to a new MP4.</p><button id="original">Show original video</button><p class="hint" id="photo"></p></section>
<section><h2>Feedback at <span id="commentTime">0:00</span></h2><textarea id="note" aria-label="Change request" placeholder="Pause here and describe what you’d like to change…"></textarea><div class="actions"><button id="add">Add comment</button><button id="save">Save feedback</button></div><div id="comments"></div></section>
<section><div class="actions"><button class="primary" id="export">Export colour change</button><button id="request">Copy edit request</button></div><p class="hint">Paste the edit request into your agent chat to apply comments and create a new version. Comments are saved, not automatically executed.</p><p id="status" role="status"></p></section></aside></main>
<script>
const $=id=>document.getElementById(id), v=$('video');const token='__TOKEN__';let state,custom=false,busy=false,dirty=false,objectURL;
const time=t=>`${Math.floor(t/60)}:${(t%60).toFixed(2).padStart(5,'0')}`;
async function api(path,data){const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json','X-Review-Token':token},body:JSON.stringify(data)});const j=await r.json();if(!r.ok)throw Error(j.error);return j}
function status(t){$('status').textContent=t}
function sync(){ $('scrub').value=v.currentTime;$('clock').textContent=`${time(v.currentTime)} / ${time(v.duration||state?.duration||0)}`;$('commentTime').textContent=time(v.currentTime);$('play').textContent=v.paused?'Play':'Pause';if(custom)preview() }
async function preview(){dirty=true;if(busy)return;busy=true;try{while(dirty&&custom){dirty=false;const t=v.currentTime,color=$('colour').value;const r=await fetch(`/frame?t=${t}&color=${encodeURIComponent(color)}`);if(!r.ok)throw Error('Preview could not render');const next=URL.createObjectURL(await r.blob());if(custom){$('frame').src=next;$('frame').hidden=false}if(objectURL)URL.revokeObjectURL(objectURL);objectURL=next}}catch(e){status(e.message)}finally{busy=false}}
function colour(c){$('colour').value=c;$('hex').textContent=c.toUpperCase();custom=true;preview()}
function comments(){ $('comments').replaceChildren();$('markers').replaceChildren();state.comments.forEach((c,i)=>{const row=document.createElement('div');row.className='comment';const jump=document.createElement('button');jump.textContent=time(c.time);jump.onclick=()=>{v.pause();v.currentTime=c.time;sync()};const del=document.createElement('button');del.textContent='Remove';del.onclick=()=>{state.comments.splice(i,1);comments();save().catch(e=>status(e.message))};row.append(jump,del,document.createTextNode('\n'+c.text));$('comments').append(row);const mark=document.createElement('button');mark.className='marker';mark.style.left=`${100*c.time/state.duration}%`;mark.title=`${time(c.time)}: ${c.text}`;mark.setAttribute('aria-label',mark.title);mark.onclick=jump.onclick;$('markers').append(mark)}) }
async function save(){const result=await api('/save',{background:$('colour').value,comments:state.comments});status('Feedback saved.');return result}
$('play').onclick=()=>{v.paused?v.play():v.pause()};$('scrub').oninput=()=>{v.pause();v.currentTime=Number($('scrub').value);sync()};$('back').onclick=()=>{v.pause();v.currentTime=Math.max(0,v.currentTime-1/60);sync()};$('next').onclick=()=>{v.pause();v.currentTime=Math.min(v.duration,v.currentTime+1/60);sync()};$('rate').onchange=()=>v.playbackRate=Number($('rate').value);$('colour').oninput=()=>colour($('colour').value);$('original').onclick=()=>{custom=false;$('frame').hidden=true};$('note').onfocus=()=>{v.pause();sync()};
$('add').onclick=async()=>{if(!$('note').value.trim())return;state.comments.push({time:v.currentTime,text:$('note').value.trim()});$('note').value='';comments();try{await save()}catch(e){status(e.message)}};
$('save').onclick=()=>save().catch(e=>status(e.message));$('request').onclick=async()=>{try{const result=await save();await navigator.clipboard.writeText(result.prompt);status('Edit request copied. Paste it into your agent chat to run the changes.')}catch(e){status(e.message)}};
$('export').onclick=async()=>{try{await save();await api('/render',{});status('Exporting colour change…');$('export').disabled=true;const poll=setInterval(async()=>{const s=await(await fetch('/state')).json();if(s.job.status!=='rendering'){clearInterval(poll);$('export').disabled=false;status(s.job.status==='complete'?`Saved new video: ${s.job.output}`:`Export failed: ${s.job.error}`)}},1500)}catch(e){status(e.message)}};
['timeupdate','seeked','play','pause','loadedmetadata','ended'].forEach(e=>v.addEventListener(e,sync));
fetch('/state').then(r=>r.json()).then(s=>{state=s;$('scrub').max=s.duration;const c=s.palette[s.background.toLowerCase()]||s.background;$('colour').value=c;$('hex').textContent=c;Object.entries(s.palette).forEach(([name,c])=>{const b=document.createElement('button');b.className='swatch';b.style.background=c;b.title=name;b.setAttribute('aria-label',name);b.onclick=()=>colour(c);$('swatches').append(b)});$('photo').textContent=s.photo?'Selecting a colour replaces the photo background in the new export.':'';comments();sync()}).catch(e=>status(e.message));
</script></html>
