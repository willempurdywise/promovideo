<!doctype html><html><head><meta name="viewport" content="width=device-width, initial-scale=1"><style>
body {margin:0;font:18px system-ui;background:white;color:#163300} header{padding:24px;background:#eee} main{padding:24px} button{padding:16px;border:0;border-radius:20px;background:#9fe870;font:inherit} #review{position:fixed;inset:0;background:#163300;color:white;transform:translateX(100%);transition:transform .5s cubic-bezier(.32,.72,0,1);padding:28px} #review.open{transform:none} #list{height:180px;overflow:auto;margin:20px 0} input{font:inherit;width:200px;padding:12px}
</style></head><body><header>Prototype fixture</header><main><label>Amount <input aria-label="Amount"></label><div id="list"><p>Clara Smith</p><p>Current account</p><p>GBP balance</p><p>Transfer details</p><p>Review recipient</p><p>Fees included</p><p>Ready to send</p></div><button onclick="document.querySelector('#review').classList.add('open');document.querySelector('#amount').textContent=document.querySelector('input').value">Continue</button></main><section id="review"><h1>Review</h1><p><span id="amount"></span> GBP to Clara Smith</p></section></body></html>
